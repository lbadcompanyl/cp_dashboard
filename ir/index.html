<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IR News Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
<!-- PWA: ติดตั้งเป็นแอปได้จากทุกหน้า ไม่ใช่แค่หน้าแรก -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0d0d0d" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script>
  <link rel="stylesheet" href="./styles.css?v=22" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📰</span>
      <div>
        <h1>IR News Monitor</h1>
        <p class="sub" id="updated">กำลังโหลด…</p>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="/" class="refresh" style="text-decoration:none" title="กลับหน้าหลัก">🏠 หน้าหลัก</a>
      <button id="refresh" class="refresh" title="ดึงข้อมูลใหม่">🔄 รีเฟรช</button>
    </div>
  </header>

  <div class="gsearch">
    <input type="search" id="gsearch" placeholder="🔎 ค้นหาทุกคอลัมน์พร้อมกัน…" autocomplete="off" />
  </div>

  <div class="swipe-dots" id="swipeDots"></div>

  <main class="board" id="board">
    <!-- 4 panels: 🇹🇭 ในประเทศ · 🌏 ต่างประเทศ · CP · ปศุสัตว์ -->
    <section class="panel" data-source="newsth">
      <div class="phead">
        <span class="ptitle"><span class="ptag news">News</span>🇹🇭 ในประเทศ</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-rc>
          <option value="all">ทุกช่วงเวลา</option>
          <option value="24">24 ชม.</option>
          <option value="48">48 ชม.</option>
          <option value="72">3 วัน</option>
          <option value="168">7 วัน</option>
        </select>
      </div>
      <div class="list" data-list></div>
    </section>

    <section class="panel" data-source="newsintl">
      <div class="phead">
        <span class="ptitle"><span class="ptag news">News</span>🌏 ต่างประเทศ</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-rc>
          <option value="all">ทุกช่วงเวลา</option>
          <option value="24">24 ชม.</option>
          <option value="48">48 ชม.</option>
          <option value="72">3 วัน</option>
          <option value="168">7 วัน</option>
        </select>
      </div>
      <div class="list" data-list></div>
    </section>

    <section class="panel" data-source="alert1">
      <div class="phead">
        <span class="ptitle"><span class="ptag alert">Alert</span>🔔 CP / ซีพี</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-rc>
          <option value="all">ทุกช่วงเวลา</option>
          <option value="24">24 ชม.</option>
          <option value="48">48 ชม.</option>
          <option value="72">3 วัน</option>
          <option value="168">7 วัน</option>
        </select>
      </div>
      <div class="list" data-list></div>
    </section>

    <section class="panel" data-source="alert2">
      <div class="phead">
        <span class="ptitle"><span class="ptag alert">Alert</span>🐷 ปศุสัตว์ · อาหาร · การค้า</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-rc>
          <option value="all">ทุกช่วงเวลา</option>
          <option value="24">24 ชม.</option>
          <option value="48">48 ชม.</option>
          <option value="72">3 วัน</option>
          <option value="168">7 วัน</option>
        </select>
      </div>
      <div class="list" data-list></div>
    </section>
  </main>

  <script src="/flags.js?v=24"></script>
  <script src="./app.js?v=28"></script>
</body>
</html>
