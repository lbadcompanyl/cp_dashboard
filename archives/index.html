<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>คลังข่าว</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗃️</text></svg>" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="คลังข่าว" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- ⭐ bump เลขนี้ที่เดียวทุกครั้งที่แก้หน้านี้ -->
<meta name="page-ver" content="23" />
<script>(function(){function init(){var el=document.getElementById("vtag");if(!el)return;var m=document.querySelector('meta[name="page-ver"]');var v=m?m.content:"";if(!v){var sc=document.querySelector('script[src*="app.js"]');var mm=sc&&sc.getAttribute("src").match(/v=(\d+)/);v=mm?mm[1]:"?";}function paint(sw){el.textContent="v"+v+(sw?" · sw"+sw:"");}paint(0);try{if(navigator.serviceWorker){navigator.serviceWorker.addEventListener("message",function(e){if(e.data&&e.data.type==="sw-version")paint(e.data.version);});navigator.serviceWorker.ready.then(function(r){var c=navigator.serviceWorker.controller||r.active;if(c)c.postMessage({type:"get-version"});});}}catch(x){}}if(document.readyState!=="loading")init();else document.addEventListener("DOMContentLoaded",init);})();if("serviceWorker" in navigator){/* เช็ค service worker ตัวใหม่ "วันละครั้ง" พอ (เจ้าของสั่ง 11 ส.ค. 2026) — เดิมเช็คทุกครั้งที่สลับกลับเข้าแอป พอ deploy บ่อยๆ ป้าย "มีเวอร์ชันใหม่" เด้งทั้งวัน · ตัวเช็คหน้าเว็บ (page-ver) เป็นวันละครั้งอยู่แล้ว เหลือตัวนี้ที่ยังถี่อยู่ · ทางลัด: แตะที่ป้ายเลขเวอร์ชัน = สั่งเช็คเดี๋ยวนี้ ใช้ตอนเพิ่ง release แล้วอยากรู้ว่าถึงเครื่องหรือยัง */var __verEvery=864e5,__verKey="swChkAt";function __verDue(){try{return Date.now()-(+localStorage.getItem(__verKey)||0)>__verEvery;}catch(x){return true;}}function __verMark(){try{localStorage.setItem(__verKey,String(Date.now()));}catch(x){}}addEventListener("load",function(){navigator.serviceWorker.register("/sw.js",{updateViaCache:"none"}).then(function(r){if(!r)return;function chk(force){if(!force&&!__verDue())return;__verMark();r.update();}chk(false);document.addEventListener("visibilitychange",function(){if(!document.hidden)chk(false);});var vt=document.getElementById("vtag");if(vt){vt.style.cursor="pointer";vt.title="แตะเพื่อเช็คเวอร์ชันใหม่เดี๋ยวนี้ (ปกติเช็คให้เองวันละครั้ง)";vt.addEventListener("click",function(){var t=vt.textContent;vt.textContent="กำลังเช็ค…";setTimeout(function(){if(vt.textContent==="กำลังเช็ค…")vt.textContent=t;},1500);chk(true);});}}).catch(function(){});});/* ⚠️ "เพิ่งติดตั้ง sw ครั้งแรก" ไม่ใช่ "มีเวอร์ชันใหม่" — sw ยิง sw-updated ตอน activate เสมอ รวมถึงครั้งแรกสุด ทำให้คนเปิดเว็บครั้งแรก (หรือ iOS ล้าง sw ทิ้งตอนไม่ได้เปิดเกิน 7 วัน) เจอแถบ "มีเวอร์ชันใหม่" ทั้งที่เพิ่งโหลดของล่าสุดมาหมาดๆ ดูจาก controller ตอนหน้าเริ่มทำงาน: ไม่มี = ติดตั้งครั้งแรก ไม่ต้องบอกอะไร */var __hadCtrl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("message",function(e){if(!e.data||e.data.type!=="sw-updated")return;if(!__hadCtrl)return;try{if(sessionStorage.getItem("swReloaded"))return;sessionStorage.setItem("swReloaded","1");}catch(x){}if(document.hidden){location.reload();return;}if(document.getElementById("updbar"))return;var b=document.createElement("button");b.id="updbar";b.textContent="\ud83d\udd04 มีเวอร์ชันใหม่ — แตะเพื่ออัปเดต";b.style.cssText="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;border:0;border-radius:999px;padding:11px 20px;background:#2563eb;color:#fff;font:600 14px/1 system-ui,-apple-system,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer";b.onclick=function(){location.reload();};document.body.appendChild(b);addEventListener("visibilitychange",function(){if(document.hidden)location.reload();},{once:true});});}</script>
<link rel="stylesheet" href="styles.css?v=19" />
</head>
<body>
<div class="wrap">

  <div class="appbar">
    <div class="logo">🗃️ คลังข่าว</div>
    <div class="bar-right">
      <span id="vtag"></span>
      <a class="btn" href="/">🏠 หน้าหลัก</a>
    </div>
  </div>

  <!-- ⭐ ช่องค้นหาคือฟีเจอร์หลักของหน้านี้ — ให้เด่นที่สุด ที่เหลือเป็นของเสริม
       ติดบนสุดเสมอ เลื่อนอ่านผลลัพธ์แล้วยังแก้คำค้นต่อได้ทันที -->
  <div class="sticky">
    <!-- 🔀 **2 โหมด สลับด้วยปุ่มในช่องค้นหา** — 🤖 ค้นด้วย AI (ตั้งต้น) · 🔤 ค้นด้วยคำ
         (เจ้าของสั่ง 27 ส.ค. 2026: "สลับเป็นหมวด ค้นด้วยคำ ได้ด้วย")
         ⚠️ ทั้ง 2 โหมดต้องกด Enter/ปุ่มเหมือนกัน — **ห้ามให้โหมดไหนค้นสดระหว่างพิมพ์**
            สิ่งที่เจ้าของสั่งเลิกเมื่อ 26 ส.ค. คือ "ระบบเดาเองว่าที่พิมพ์เป็นคำถามหรือคำค้น"
            ไม่ใช่ "ห้ามมีโหมด" · โหมดที่ผู้ใช้กดเลือกเองและเห็นชัด ไม่ใช่ปัญหาเดียวกัน
         📢 บรรทัดข้างล่างนี้อยู่ "เหนือ" ช่องค้นหา และ **เปลี่ยนตามโหมด** (ดู MODES ใน app.js) -->
    <p class="qhint">พิมพ์เป็นประโยคแล้วกด <b>Enter</b> — ถามแบบที่คุยกับคนได้เลย<span class="qex"> เช่น <i>ข่าว PM 2.5 เชียงใหม่เดือนที่แล้ว</i> · กดป้าย <b>🤖</b> เพื่อสลับเป็นค้นด้วยคำ</span></p>
    <div class="searchrow">
      <!-- 🔀 **ปุ่มสลับโหมดแบบ 2 ช่อง — โชว์ทั้ง 2 ตัวเลือกพร้อมกัน**
           (เจ้าของแจ้ง 27 ส.ค. 2026: "คนจะไม่รู้ซิว่ากดได้")
           🚫 **ห้ามกลับไปเป็นป้ายใบเดียวที่กดแล้วสลับ** — ลองแล้ว 2 รอบ ไม่มีใครรู้ว่ากดได้
              ต่อให้ใส่ลูกศร ▾ กับเงาแล้วก็ตาม เพราะมันยังอ่านเป็น "ป้ายบอกสถานะ" อยู่ดี
           ✅ โชว์ทั้ง 2 ช่อง = ตัวที่ยังไม่ได้เลือกทำหน้าที่บอกเองว่า "กดตรงนี้ได้"
           ⚠️ จอแคบเหลือแต่ไอคอน 🤖 / 🔤 ไม่งั้นกินที่พิมพ์เกินครึ่งช่อง -->
      <div id="modeseg" class="modeseg" role="group" aria-label="โหมดค้นหา">
        <button type="button" class="mseg on" data-mode="ai" aria-pressed="true" title="ถามเป็นประโยค ให้ AI ตีความให้">
          <span aria-hidden="true">🤖</span><span class="mlong">ถาม AI</span>
        </button>
        <button type="button" class="mseg" data-mode="kw" aria-pressed="false" title="ค้นด้วยคำตรงๆ ไม่ใช้ AI">
          <span aria-hidden="true">🔤</span><span class="mlong">ค้นคำ</span>
        </button>
      </div>
      <input id="q" type="search" autofocus autocomplete="off" enterkeyhint="go"
             placeholder="ถามเป็นประโยค เช่น หาข่าวด้านดีของปลาหมอคางดำทั้งหมด"
             aria-label="ถามคลังข่าวเป็นประโยค" />
      <button id="qclear" class="qclear" type="button" title="ล้างคำถาม" hidden>✕</button>
      <!-- ปุ่มหลักของหน้านี้ — สีเน้น เพราะเป็นการกระทำเดียวที่ทำให้เกิดผลลัพธ์ -->
      <button id="askbtn" class="ftoggle askbtn" type="button" title="ถาม (หรือกด Enter)">
        <span aria-hidden="true">🔎</span><span class="flabel">ถาม</span>
      </button>
      <!-- ⚠️ ปุ่มตัวกรองอยู่ "ในช่องค้นหา" มุมขวา (เจ้าของสั่ง 20 ส.ค. 2026)
           วางไว้ข้างนอกแล้วมองไม่เห็น · ในนี้คือจุดที่สายตาอยู่อยู่แล้ว -->
      <button id="ftoggle" class="ftoggle" type="button" aria-expanded="false" aria-controls="filters">
        <span aria-hidden="true">⚙</span><span class="flabel">ตัวกรอง</span><span id="fbadge" class="fbadge" hidden></span>
        <span class="fcaret" aria-hidden="true">▸</span>
      </button>
    </div>
    <!-- ⚠️ ต้องบอกเสมอว่า "ตีความคำถามเป็นอะไร" — ผลที่ถูกคัดโดยที่ผู้ใช้ไม่รู้ว่าคัดด้วยอะไร
         คือกับดักเดียวกับตัวกรองที่พับไว้แล้วไม่มีสรุป (ดู filterSummary) -->
    <div id="askbar" class="askbar" hidden></div>
  </div>

  <div class="statusrow">
    <span id="count" class="count"></span>
    <span class="grow"></span>
    <button id="clearall" class="btn sm" type="button" hidden>ล้างตัวกรอง</button>
  </div>
  <p id="fsum" class="fsum" hidden></p>

  <div class="filters" id="filters" hidden>
    <!-- ช่วงวันที่ -->
    <section class="fbox">
      <h2 class="fh">ช่วงวันที่</h2>
      <div class="dates">
        <label>จาก <input id="from" type="date" /></label>
        <label>ถึง <input id="to" type="date" /></label>
      </div>
      <p class="fnote" id="loadednote"></p>
    </section>

    <!-- หมวด -->
    <section class="fbox">
      <h2 class="fh">หมวด <span class="fhint">เลือกได้หลายหมวด</span></h2>
      <div class="chips" id="cats"></div>
    </section>

    <!-- สำนักข่าว -->
    <section class="fbox">
      <h2 class="fh">สำนักข่าว</h2>
      <input id="srcq" class="minisearch" type="search" autocomplete="off"
             placeholder="พิมพ์ค้นในรายการ…" aria-label="ค้นในรายชื่อสำนักข่าว" />
      <div class="srclist" id="srcs"></div>
    </section>
  </div>

  <div id="list" class="list"></div>
  <div id="more" class="morewrap"></div>

</div>
<script src="outlets.config.js?v=5"></script>
<script src="app.js?v=15"></script>
</body>
</html>
