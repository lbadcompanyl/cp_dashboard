<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trend Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>" />
<!-- PWA: ติดตั้งเป็นแอปได้จากทุกหน้า ไม่ใช่แค่หน้าแรก -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0d0d0d" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>(function(){function init(){var el=document.getElementById("vtag");if(!el)return;var m=document.querySelector('meta[name="page-ver"]');var v=m?m.content:"";if(!v){var sc=document.querySelector('script[src*="app.js"]');var mm=sc&&sc.getAttribute("src").match(/v=(\d+)/);v=mm?mm[1]:"?";}function paint(sw){el.textContent="v"+v+(sw?" · sw"+sw:"");}paint(0);try{if(navigator.serviceWorker){navigator.serviceWorker.addEventListener("message",function(e){if(e.data&&e.data.type==="sw-version")paint(e.data.version);});navigator.serviceWorker.ready.then(function(r){var c=navigator.serviceWorker.controller||r.active;if(c)c.postMessage({type:"get-version"});});}}catch(x){}}if(document.readyState!=="loading")init();else document.addEventListener("DOMContentLoaded",init);})();if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("/sw.js",{updateViaCache:"none"}).then(function(r){if(!r)return;r.update();document.addEventListener("visibilitychange",function(){if(!document.hidden)r.update();});}).catch(function(){});});navigator.serviceWorker.addEventListener("message",function(e){if(!e.data||e.data.type!=="sw-updated")return;try{if(sessionStorage.getItem("swReloaded"))return;sessionStorage.setItem("swReloaded","1");}catch(x){}if(document.hidden){location.reload();return;}if(document.getElementById("updbar"))return;var b=document.createElement("button");b.id="updbar";b.textContent="\ud83d\udd04 มีเวอร์ชันใหม่ — แตะเพื่ออัปเดต";b.style.cssText="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;border:0;border-radius:999px;padding:11px 20px;background:#2563eb;color:#fff;font:600 14px/1 system-ui,-apple-system,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer";b.onclick=function(){location.reload();};document.body.appendChild(b);addEventListener("visibilitychange",function(){if(document.hidden)location.reload();},{once:true});});}</script>
  <link rel="stylesheet" href="./styles.css?v=60" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📡</span>
      <div>
        <h1>Trend Dashboard</h1>
        <p class="sub" id="updated">กำลังโหลด…</p>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="vtag" style="font-size:10px;opacity:.45;white-space:nowrap"></span>
      <a href="/" class="refresh" style="text-decoration:none" title="กลับหน้าหลัก">🏠 หน้าหลัก</a>
      <button id="refresh" class="refresh" title="ดึงข้อมูลใหม่">🔄 รีเฟรช</button>
    </div>
  </header>

  <div class="gsearch">
    <input type="search" id="gsearch" placeholder="🔎 ค้นหาทุกคอลัมน์พร้อมกัน…" autocomplete="off" />
  </div>

  <div class="swipe-dots" id="swipeDots"></div>

  <main class="board" id="board">
    <!-- 7 panels: News · Alert 1 · Alert 2 · Google Trends · X · YouTube · เช็ค Trend -->
    <section class="panel" data-source="news">
      <div class="phead">
        <span class="ptitle"><span class="dot news"></span>📰 Google News</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-rc>
          <option value="all">ทุกช่วงเวลา</option>
          <option value="24">24 ชม.</option>
          <option value="48">48 ชม.</option>
          <option value="72">3 วัน</option>
          <option value="168">7 วัน</option>
        </select>
      </div>
      <div class="list" data-list></div>
    </section>

    <section class="panel" data-source="alert1">
      <div class="phead">
        <span class="ptitle"><span class="dot alert"></span>🔔 CP</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-rc>
          <option value="all">ทุกช่วงเวลา</option>
          <option value="24">24 ชม.</option>
          <option value="48">48 ชม.</option>
          <option value="72">3 วัน</option>
          <option value="168">7 วัน</option>
        </select>
      </div>
      <div class="list" data-list></div>
    </section>

    <section class="panel" data-source="alert2">
      <div class="phead">
        <span class="ptitle"><span class="dot alert"></span>🔔 หัวข้อที่จับตามอง</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-rc>
          <option value="all">ทุกช่วงเวลา</option>
          <option value="24">24 ชม.</option>
          <option value="48">48 ชม.</option>
          <option value="72">3 วัน</option>
          <option value="168">7 วัน</option>
        </select>
      </div>
      <div class="list" data-list></div>
    </section>

    <section class="panel" data-source="trends">
      <div class="phead">
        <span class="ptitle"><span class="dot trends"></span>🔥 Google Trends</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-geo title="เลือกประเทศ">
          <option value="TH">🇹🇭 ไทย</option>
          <option value="US">🇺🇸 สหรัฐฯ</option>
          <option value="GB">🇬🇧 อังกฤษ</option>
          <option value="JP">🇯🇵 ญี่ปุ่น</option>
          <option value="KR">🇰🇷 เกาหลี</option>
          <option value="SG">🇸🇬 สิงคโปร์</option>
          <option value="IN">🇮🇳 อินเดีย</option>
          <option value="DE">🇩🇪 เยอรมนี</option>
          <option value="FR">🇫🇷 ฝรั่งเศส</option>
        </select>
        <select class="rc" data-cat title="หมวดหมู่ (แบบ Google Trends)">
          <option value="0">📚 ทุกหมวด</option>
          <option value="3">💼 ธุรกิจ/การเงิน</option>
          <option value="4">🎬 บันเทิง</option>
          <option value="5">🍔 อาหาร/เครื่องดื่ม</option>
          <option value="6">🎮 เกม</option>
          <option value="7">🩺 สุขภาพ</option>
          <option value="14">🏛️ การเมือง</option>
          <option value="10">⚖️ กฎหมาย/ราชการ</option>
          <option value="15">🔬 วิทยาศาสตร์</option>
          <option value="16">🛍️ ช้อปปิ้ง</option>
          <option value="17">⚽ กีฬา</option>
          <option value="18">💻 เทคโนโลยี</option>
          <option value="19">✈️ ท่องเที่ยว</option>
        </select>
        <select class="rc" data-hours title="ช่วงเวลา (แบบ Google)">
          <option value="4">4 ชม.</option>
          <option value="24" selected>24 ชม.</option>
          <option value="48">48 ชม.</option>
          <option value="168">7 วัน</option>
        </select>
      </div>
      <div class="list" data-list></div>
    </section>

    <section class="panel" data-source="yttrends">
      <div class="phead">
        <span class="ptitle"><span class="dot yttrends"></span>▶️ คลิปมาแรง YouTube</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-ytgeo title="เลือกประเทศ">
          <option value="TH">🇹🇭 ไทย</option>
          <option value="WW">🌏 ทั่วโลก</option>
          <option value="US">🇺🇸 สหรัฐฯ</option>
          <option value="GB">🇬🇧 อังกฤษ</option>
          <option value="JP">🇯🇵 ญี่ปุ่น</option>
          <option value="KR">🇰🇷 เกาหลี</option>
          <option value="SG">🇸🇬 สิงคโปร์</option>
          <option value="IN">🇮🇳 อินเดีย</option>
        </select>
        <!-- ข่าว = ขอชาร์ตหมวด News & Politics จาก YouTube โดยตรง · ทั่วไป = ชาร์ตรวมทุกหมวด -->
        <div class="kindtog" data-ytkind>
          <button type="button" class="cat on" data-k="news">📰 ข่าว</button>
          <button type="button" class="cat" data-k="all">🌐 ทั่วไป</button>
        </div>
        <div class="ysort" data-ysort>
          <button type="button" class="cat" data-sort="rank">🏆 อันดับจาก YouTube</button>
          <!-- ปุ่ม "มาแรง" กับตัวเลือกช่วงเวลาเป็นชิ้นเดียวกัน — กดแล้วเลือกวันได้เลย ไม่ต้องมีปุ่มแยก -->
          <label class="cat ygrow on" data-sort="growth">📈 มาแรง
            <select data-ytwin title="ช่วงเวลาที่ใช้วัดว่ามาแรง">
              <option value="4">4 ชม.</option>
              <option value="24" selected>24 ชม.</option>
              <option value="48">48 ชม.</option>
              <option value="72">3 วัน</option>
              <option value="168">7 วัน</option>
            </select>
          </label>
          <button type="button" class="cat" data-sort="new">🕒 ใหม่ล่าสุด</button>
        </div>
      </div>
      <div class="list" data-list></div>
    </section>

    <section class="panel" data-source="xtrends">
      <div class="phead">
        <span class="ptitle"><span class="dot xtrends"></span>𝕏 เทรนด์บน X</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <select class="rc" data-xgeo title="เลือกประเทศ">
          <option value="thailand">🇹🇭 ไทย</option>
          <option value="united-states">🇺🇸 สหรัฐฯ</option>
          <option value="japan">🇯🇵 ญี่ปุ่น</option>
          <option value="korea">🇰🇷 เกาหลี</option>
          <option value="singapore">🇸🇬 สิงคโปร์</option>
          <option value="worldwide">🌏 ทั่วโลก</option>
        </select>
        <!-- ข่าว = ตัดบันเทิง/กีฬาออก · ทั่วไป = ทุกหมวด -->
        <div class="kindtog" data-xkind>
          <button type="button" class="cat" data-k="news">📰 ข่าว</button>
          <button type="button" class="cat on" data-k="all">🌐 ทั่วไป</button>
        </div>
      </div>
      <div class="list" data-list></div>
    </section>
    <!-- เช็คว่าคำหนึ่งคนสนใจแค่ไหน ก่อนตัดสินใจเอาเข้า Alert -->
    <section class="panel" data-source="kwcheck">
      <div class="phead">
        <span class="ptitle"><span class="dot kwcheck"></span>🔎 เช็ค Trend</span>
        <span class="pcount" data-count>—</span>
      </div>
      <div class="filters">
        <input class="kw" data-kwq type="search" placeholder="พิมพ์คำที่อยากเช็ค…" autocomplete="off" />
        <select class="rc" data-kwgeo title="เลือกประเทศ">
          <option value="TH">🇹🇭 ไทย</option>
          <option value="">🌏 ทั่วโลก</option>
          <option value="US">🇺🇸 สหรัฐฯ</option>
          <option value="GB">🇬🇧 อังกฤษ</option>
          <option value="JP">🇯🇵 ญี่ปุ่น</option>
          <option value="KR">🇰🇷 เกาหลี</option>
          <option value="SG">🇸🇬 สิงคโปร์</option>
          <option value="IN">🇮🇳 อินเดีย</option>
        </select>
        <select class="rc" data-kwtime title="ช่วงเวลาที่ดูย้อนหลัง">
          <option value="now 7-d">7 วัน</option>
          <option value="today 1-m">1 เดือน</option>
          <option value="today 3-m">3 เดือน</option>
          <option value="today 12-m" selected>12 เดือน</option>
          <option value="today 5-y">5 ปี</option>
        </select>
        <button type="button" class="cat on" data-kwgo>เช็ค</button>
      </div>
      <div class="list" data-list></div>
    </section>
  </main>

  <button id="scrollcue" type="button" hidden><span class="cuearrow">▼</span> เลื่อนเพื่อดู Trend · X · YouTube</button>

  <script src="/flags.js?v=31"></script>
  <script src="./app.js?v=104"></script>
</body>
</html>
